spring.application.name=findx

# ============================================
# Database Configuration (H2 File-based DB - Zero Config / Embedded)
# Data will persist in ./data/findx_db.mv.db
# ============================================
spring.datasource.url=jdbc:h2:file:./data/findx_db;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console Configuration (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --------------------------------------------
# MySQL Configuration (Uncomment if MySQL Server is running)
# --------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/findx_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=mysql
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
findx.upload.dir=src/main/resources/static/uploads/

# ============================================
# Thymeleaf Configuration
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.address=0.0.0.0
server.servlet.session.tracking-modes=cookie

# ============================================
# Logging
# ============================================
logging.level.com.example.findx=INFO

