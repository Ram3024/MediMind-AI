<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 - Server Error | FindX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #fff5f5 0%, #fef3c7 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .error-code { font-size: 8rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, #dc2626, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .error-icon { font-size: 5rem; color: #dc2626; }
    .btn-home { background: linear-gradient(135deg, #dc2626, #f59e0b); border: none; color: #fff; padding: 12px 32px; border-radius: 12px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .btn-home:hover { color: #fff; opacity: 0.9; transform: translateY(-1px); }
  </style>
</head>
<body>
<div class="text-center px-4">
  <div class="error-code">500</div>
  <i class="bi bi-exclamation-triangle-fill error-icon d-block mb-2"></i>
  <h2 class="fw-bold mb-2">Something Went Wrong</h2>
  <p class="text-muted mb-4" style="max-width:400px;margin:0 auto;">An internal server error occurred. Our team has been notified. Please try again later.</p>
  <div class="d-flex gap-3 justify-content-center">
    <a href="/" class="btn-home"><i class="bi bi-house-fill"></i>Go Home</a>
    <a href="javascript:location.reload()" class="btn btn-outline-secondary px-4" style="border-radius:12px;">
      <i class="bi bi-arrow-clockwise me-2"></i>Try Again
    </a>
  </div>
</div>
</body>
</html>
