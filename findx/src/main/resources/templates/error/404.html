<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found | FindX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .error-icon { font-size: 6rem; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .error-code { font-size: 8rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-home { background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; color: #fff; padding: 12px 32px; border-radius: 12px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .btn-home:hover { color: #fff; opacity: 0.9; transform: translateY(-1px); }
  </style>
</head>
<body>
<div class="text-center px-4">
  <div class="error-code">404</div>
  <i class="bi bi-search error-icon d-block"></i>
  <h2 class="fw-bold mt-3 mb-2">Page Not Found</h2>
  <p class="text-muted mb-4" style="max-width:400px;margin:0 auto;">Oops! The page you're looking for doesn't exist or has been moved.</p>
  <div class="d-flex gap-3 justify-content-center">
    <a href="/" class="btn-home"><i class="bi bi-house-fill"></i>Go Home</a>
    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4" style="border-radius:12px;">
      <i class="bi bi-arrow-left me-2"></i>Go Back
    </a>
  </div>
</div>
</body>
</html>
