<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="auth-page">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2" style="width:52px;height:52px;font-size:1.4rem;background:linear-gradient(135deg,#059669,#10b981);">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h4 class="fw-800 mb-0">Reset Password</h4>
      <p class="text-muted small">Enter your new password below</p>
    </div>

    <div th:if="${error}" class="alert alert-danger d-flex align-items-center py-2 mb-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <small th:text="${error}">Error</small>
    </div>
    <div th:if="${msg}" class="alert alert-success d-flex align-items-center py-2 mb-3">
      <i class="bi bi-check-circle-fill me-2"></i>
      <small th:text="${msg}">Message</small>
    </div>

    <!-- Info Notice -->
    <div class="mb-3 p-3 rounded-3" style="background:#f0fdf4;border:1px solid #86efac;">
      <p class="small fw-semibold mb-1" style="color:#059669;"><i class="bi bi-envelope-check me-1"></i>Check Your Gmail Inbox</p>
      <p class="small text-muted mb-0">
        A 6-digit Reset Code &amp; link has been sent to your Gmail. Enter the code below or click the link in your email.
      </p>
    </div>

    <form th:action="@{/reset-password}" method="post">
      
      <!-- 6-digit Code / Token input -->
      <div class="mb-3" th:if="${token == null or #strings.isEmpty(token)}">
        <label class="form-label fw-semibold">6-Digit Reset Code <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-123"></i></span>
          <input type="text" name="token" class="form-control fw-bold text-center" placeholder="e.g. 582914" maxlength="6" required style="letter-spacing: 4px; font-size: 1.1rem;" autofocus>
        </div>
        <div class="form-text small text-muted">Enter the 6-digit code received in your Gmail</div>
      </div>
      
      <!-- If token already in URL, use hidden input -->
      <div th:if="${token != null and not #strings.isEmpty(token)}">
        <input type="hidden" name="token" th:value="${token}">
        <div class="mb-3 p-2 rounded-2 bg-light border text-center small text-success fw-semibold">
          <i class="bi bi-patch-check-fill me-1"></i>Reset code verified from link!
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">New Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="newPassword" id="rp-new" class="form-control" placeholder="Min 6 characters" required minlength="6">
          <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('rp-new',this)" style="border-radius:0 10px 10px 0;">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm New Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="confirmPassword" id="rp-confirm" class="form-control" placeholder="Repeat password" required minlength="6">
          <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('rp-confirm',this)" style="border-radius:0 10px 10px 0;">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-success w-100 py-2 mb-3 shadow-sm" id="rp-submit-btn" style="border-radius: 10px; font-weight: 600;">
        <i class="bi bi-check-circle me-2"></i>Update Password
      </button>
    </form>

    <div class="text-center">
      <a href="/login" class="small" style="color:#6366f1;"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
    </div>
  </div>
</div>

<script>
function togglePwd(id, btn) {
  var inp = document.getElementById(id);
  var icon = btn.querySelector('i');
  if (inp.type === 'password') {
    inp.type = 'text'; icon.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password'; icon.className = 'bi bi-eye';
  }
}
</script>
</main></body>
</html>
