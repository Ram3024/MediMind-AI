<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="page-header">
  <div class="container px-4">
    <h1><i class="bi bi-robot me-2" style="color:#6366f1;"></i>My AI Matches</h1>
    <p class="text-muted mb-0">FindX AI found these potential matches for your lost items.</p>
  </div>
</div>
<div class="container px-4 py-4">
  <div th:if="${matches.empty}" class="text-center py-5 text-muted">
    <div style="width:80px;height:80px;background:#ede9fe;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#6366f1;margin:0 auto 20px;">
      <i class="bi bi-robot"></i>
    </div>
    <h5>No AI matches yet</h5>
    <p class="small">Report a lost item and our AI will search for matches automatically.</p>
    <a href="/lost/report" class="btn btn-primary">Report Lost Item</a>
  </div>

  <div class="row g-3" th:if="${!matches.empty}">
    <div class="col-md-6" th:each="match : ${matches}">
      <div class="ai-match-card">
        <div class="match-header d-flex justify-content-between align-items-center">
          <span class="small fw-semibold" style="color:#4f46e5;">
            <i class="bi bi-robot me-1"></i>AI Match · <span th:text="${match.createdAt}">Date</span>
          </span>
          <span th:class="${match.overallScore >= 80 ? 'match-score-badge score-excellent' :
                           (match.overallScore >= 65 ? 'match-score-badge score-good' :
                           (match.overallScore >= 50 ? 'match-score-badge score-moderate' : 'match-score-badge score-low'))}">
            <i class="bi bi-percent"></i> <span th:text="${match.overallScoreInt}">0</span>% Match
          </span>
        </div>
        <div class="p-3">
          <div class="row g-2 align-items-center mb-3">
            <div class="col-5">
              <div class="p-2 rounded-3 text-center" style="background:#fff5f5;border:1px solid #fecaca;">
                <div class="item-badge-lost mb-1">LOST</div>
                <div class="fw-semibold small text-truncate"
                     th:text="${lostMap[match.lostItemId] != null ? lostMap[match.lostItemId].itemName : '?'}">Item</div>
                <div style="font-size:0.7rem;color:#dc2626;" th:text="${lostMap[match.lostItemId] != null ? lostMap[match.lostItemId].city : ''}">City</div>
              </div>
            </div>
            <div class="col-2 text-center text-muted small"><i class="bi bi-arrow-left-right"></i></div>
            <div class="col-5">
              <div class="p-2 rounded-3 text-center" style="background:#f0fdf4;border:1px solid #bbf7d0;">
                <div class="item-badge-found mb-1">FOUND</div>
                <div class="fw-semibold small text-truncate"
                     th:text="${foundMap[match.foundItemId] != null ? foundMap[match.foundItemId].itemName : '?'}">Item</div>
                <div style="font-size:0.7rem;color:#059669;" th:text="${foundMap[match.foundItemId] != null ? foundMap[match.foundItemId].city : ''}">City</div>
              </div>
            </div>
          </div>

          <!-- Mini score bars -->
          <div class="row g-1 mb-3">
            <div class="col-4">
              <div class="factor-bar">
                <div class="d-flex justify-content-between"><span class="factor-label">Text</span><span class="factor-score" th:text="${match.textScoreInt+'%'}"></span></div>
                <div class="progress"><div class="progress-bar progress-text" th:style="'width:'+${match.textScoreInt}+'%'"></div></div>
              </div>
            </div>
            <div class="col-4">
              <div class="factor-bar">
                <div class="d-flex justify-content-between"><span class="factor-label">Location</span><span class="factor-score" th:text="${match.locationScoreInt+'%'}"></span></div>
                <div class="progress"><div class="progress-bar progress-location" th:style="'width:'+${match.locationScoreInt}+'%'"></div></div>
              </div>
            </div>
            <div class="col-4">
              <div class="factor-bar">
                <div class="d-flex justify-content-between"><span class="factor-label">Brand</span><span class="factor-score" th:text="${match.brandScoreInt+'%'}"></span></div>
                <div class="progress"><div class="progress-bar progress-brand" th:style="'width:'+${match.brandScoreInt}+'%'"></div></div>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <a th:href="@{/matches/detail/{id}(id=${match.id})}" class="btn btn-sm btn-primary flex-grow-1">
              <i class="bi bi-eye me-1"></i>View Details
            </a>
            <a th:href="@{/claims/submit/{id}(id=${match.id})}" class="btn btn-sm btn-success flex-grow-1">
              <i class="bi bi-file-check me-1"></i>Submit Claim
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>
