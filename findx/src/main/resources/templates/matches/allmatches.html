<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="page-header">
  <div class="container px-4">
    <h1><i class="bi bi-robot me-2" style="color:#6366f1;"></i>All AI Matches</h1>
    <p class="text-muted mb-0">Browse all high-confidence matches generated by FindX AI (≥60%).</p>
  </div>
</div>
<div class="container px-4 py-4">
  <div th:if="${matches.empty}" class="text-center py-5 text-muted">
    <i class="bi bi-robot display-4 d-block mb-3" style="color:#a5b4fc;"></i>
    <h5>No high-confidence matches yet</h5>
    <p>Start reporting lost and found items for AI matching to begin.</p>
    <a href="/lost/report" class="btn btn-primary me-2">Report Lost</a>
    <a href="/found/report" class="btn btn-success">Report Found</a>
  </div>

  <div class="row g-3" th:if="${!matches.empty}">
    <div class="col-md-6 col-lg-4" th:each="match : ${matches}">
      <div class="ai-match-card">
        <div class="match-header d-flex justify-content-between align-items-center">
          <span class="small fw-semibold" style="color:#4f46e5;">
            <i class="bi bi-robot me-1"></i>Match #<span th:text="${match.id}"></span>
          </span>
          <span th:class="${match.overallScore >= 80 ? 'match-score-badge score-excellent' :
                           (match.overallScore >= 65 ? 'match-score-badge score-good' :
                           'match-score-badge score-moderate')}"
                th:text="${match.overallScoreInt + '%'}"></span>
        </div>
        <div class="p-3">
          <div class="row g-2 align-items-center mb-3">
            <div class="col-5 text-center">
              <div class="p-2 rounded-3" style="background:#fff5f5;border:1px solid #fecaca;">
                <div class="item-badge-lost mb-1">LOST</div>
                <div class="fw-semibold small text-truncate"
                     th:text="${lostMap[match.lostItemId] != null ? lostMap[match.lostItemId].itemName : '?'}">Item</div>
              </div>
            </div>
            <div class="col-2 text-center text-muted"><i class="bi bi-arrow-left-right"></i></div>
            <div class="col-5 text-center">
              <div class="p-2 rounded-3" style="background:#f0fdf4;border:1px solid #bbf7d0;">
                <div class="item-badge-found mb-1">FOUND</div>
                <div class="fw-semibold small text-truncate"
                     th:text="${foundMap[match.foundItemId] != null ? foundMap[match.foundItemId].itemName : '?'}">Item</div>
              </div>
            </div>
          </div>
          <a th:href="@{/matches/detail/{id}(id=${match.id})}" class="btn btn-sm btn-outline-primary w-100">
            <i class="bi bi-eye me-1"></i>View AI Analysis
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>
