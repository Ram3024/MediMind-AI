<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="page-header">
  <div class="container px-4">
    <h1><i class="bi bi-file-check-fill me-2" style="color:#6366f1;"></i>Submit Claim</h1>
    <p class="text-muted mb-0">Provide verification details to prove this is your lost item.</p>
  </div>
</div>
<div class="container px-4 py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <!-- Match Score Preview -->
      <div class="card mb-4 border-0" style="background:linear-gradient(135deg,#ede9fe,#e0e7ff);border-radius:16px;padding:20px;">
        <div class="d-flex align-items-center gap-3">
          <div style="width:60px;height:60px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;font-weight:800;" th:text="${match.overallScoreInt + '%'}">0%</div>
          <div>
            <div class="fw-bold" style="color:#4f46e5;">AI Match Score</div>
            <div class="small text-muted">Lost: <strong th:text="${lostItem != null ? lostItem.itemName : ''}"></strong>
              ↔ Found: <strong th:text="${foundItem != null ? foundItem.itemName : ''}"></strong></div>
          </div>
        </div>
      </div>

      <!-- Security Notice -->
      <div class="alert d-flex align-items-center gap-3 mb-4" style="background:#fef3c7;border:1px solid #fde68a;border-radius:12px;">
        <i class="bi bi-shield-lock-fill" style="color:#d97706;font-size:1.4rem;"></i>
        <div>
          <div class="fw-bold" style="color:#92400e;">Verification Required</div>
          <div class="small" style="color:#b45309;">Provide details that only the true owner would know. These will NOT be shared publicly.</div>
        </div>
      </div>

      <div class="form-card">
        <form action="/claims/submit" method="post">
          <input type="hidden" name="lostItemId" th:value="${lostItem != null ? lostItem.id : ''}">
          <input type="hidden" name="foundItemId" th:value="${foundItem != null ? foundItem.id : ''}">
          <input type="hidden" name="aiMatchId" th:value="${match.id}">

          <div class="mb-3">
            <label class="form-label">Unique Mark / Identifying Feature <span class="text-danger">*</span></label>
            <textarea name="uniqueMark" class="form-control" rows="3" required
                      placeholder="Describe any secret mark, damage, or unique detail only you would know about this item (e.g., 'There is a small crack on the top-left corner of the screen and a red sticker inside the battery cover')" id="claim-uniquemark"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Serial Number / IMEI / ID</label>
            <input type="text" name="serialNumber" class="form-control"
                   placeholder="e.g., IMEI: 352099001761481 or Serial: SN-78945612" id="claim-serial">
            <div class="form-text">This strongly proves ownership. Check original box or purchase receipt.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Purchase / Ownership Information</label>
            <textarea name="purchaseInfo" class="form-control" rows="2"
                      placeholder="e.g., Bought from Croma on 14 March 2023 for Rs 45000. Bill has name Rahul Sharma." id="claim-purchase"></textarea>
          </div>
          <div class="mb-4">
            <label class="form-label">Additional Verification Details</label>
            <textarea name="additionalInfo" class="form-control" rows="3"
                      placeholder="Any other information that proves you are the owner..." id="claim-addinfo"></textarea>
          </div>
          <div class="d-flex gap-3">
            <button type="submit" class="btn btn-primary btn-lg flex-grow-1" id="claim-submit">
              <i class="bi bi-send-fill me-2"></i>Submit Claim
            </button>
            <a href="/matches/my" class="btn btn-outline-secondary btn-lg">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>
