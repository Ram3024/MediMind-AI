<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="page-header">
  <div class="container px-4">
    <h1><i class="bi bi-file-check-fill me-2" style="color:#6366f1;"></i>My Claims</h1>
    <p class="text-muted mb-0">Track the status of your submitted claims.</p>
  </div>
</div>
<div class="container px-4 py-4">
  <div th:if="${claims.empty}" class="text-center py-5 text-muted">
    <i class="bi bi-file-earmark-x display-4 d-block mb-3"></i>
    <h5>No claims submitted yet</h5>
    <p class="small">Go to your AI Matches and submit a claim for your lost item.</p>
    <a href="/matches/my" class="btn btn-primary">View AI Matches</a>
  </div>

  <div class="row g-3" th:if="${!claims.empty}">
    <div class="col-md-6" th:each="claim : ${claims}">
      <div class="card" style="border-radius:16px;">
        <div class="card-header py-3 px-4"
             th:style="${claim.status == 'VERIFIED' ? 'background:#dcfce7;border-radius:14px 14px 0 0;border:none;' :
                        (claim.status == 'REJECTED' ? 'background:#fee2e2;border-radius:14px 14px 0 0;border:none;' :
                        'background:#fef3c7;border-radius:14px 14px 0 0;border:none;')}">
          <div class="d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-bold">Claim #<span th:text="${claim.id}"></span></h6>
            <span th:class="${claim.status == 'VERIFIED' ? 'badge badge-verified' :
                             (claim.status == 'REJECTED' ? 'badge badge-rejected' :
                             (claim.status == 'UNDER_REVIEW' ? 'badge badge-review' : 'badge badge-pending'))}"
                  th:text="${claim.status}">PENDING</span>
          </div>
        </div>
        <div class="card-body">
          <div class="row g-2 mb-3">
            <div class="col-6">
              <div class="p-2 rounded-3" style="background:#fff5f5;border:1px solid #fecaca;">
                <div class="item-badge-lost mb-1">LOST ITEM</div>
                <div class="fw-semibold small text-truncate"
                     th:text="${lostMap[claim.lostItemId] != null ? lostMap[claim.lostItemId].itemName : 'Item #'+claim.lostItemId}">Item</div>
              </div>
            </div>
            <div class="col-6">
              <div class="p-2 rounded-3" style="background:#f0fdf4;border:1px solid #bbf7d0;">
                <div class="item-badge-found mb-1">FOUND ITEM</div>
                <div class="fw-semibold small text-truncate"
                     th:text="${foundMap[claim.foundItemId] != null ? foundMap[claim.foundItemId].itemName : 'Item #'+claim.foundItemId}">Item</div>
              </div>
            </div>
          </div>
          <p class="small text-muted mb-1">
            <i class="bi bi-calendar me-1"></i>Submitted: <span th:text="${claim.claimDate != null ? claim.claimDate.toString().substring(0,10) : 'N/A'}">Date</span>
          </p>
          <div th:if="${claim.reviewNote != null}" class="alert py-2 px-3 mb-2"
               th:style="${claim.status == 'VERIFIED' ? 'background:#dcfce7;border:none;' : 'background:#fee2e2;border:none;'}"
               style="border-radius:8px;font-size:0.82rem;">
            <i class="bi bi-info-circle me-1"></i><span th:text="${claim.reviewNote}">Note</span>
          </div>
          <a th:href="@{/claims/status/{id}(id=${claim.id})}" class="btn btn-sm btn-outline-primary w-100">
            View Full Details
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>
