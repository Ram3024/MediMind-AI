<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="page-header">
  <div class="container px-4">
    <h1><i class="bi bi-exclamation-circle-fill me-2 text-danger"></i>Lost Item Details</h1>
    <p class="text-muted mb-0" th:text="${item.itemName}">Item Name</p>
  </div>
</div>
<div class="container px-4 py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card p-4" style="border-radius:20px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="item-badge-lost" style="font-size:0.85rem;padding:6px 16px;">LOST ITEM</span>
          <span th:class="${'item-badge-' + item.status.toLowerCase()}" th:text="${item.status}">ACTIVE</span>
        </div>

        <div th:if="${item.firstImage != null}" class="mb-4 text-center">
          <img th:src="@{/uploads/{img}(img=${item.firstImage})}" class="rounded-3 img-fluid" style="max-height:320px;object-fit:cover;">
        </div>

        <h3 class="fw-bold mb-3" th:text="${item.itemName}">Item Name</h3>

        <table class="table table-borderless mb-4" style="font-size:0.95rem;">
          <tr><th style="width:30%;color:#64748b;">Category</th><td class="fw-medium" th:text="${item.category}">Category</td></tr>
          <tr th:if="${item.subCategory != null}"><th style="color:#64748b;">Sub-Category</th><td class="fw-medium" th:text="${item.subCategory}">Sub-Cat</td></tr>
          <tr th:if="${item.brand != null}"><th style="color:#64748b;">Brand</th><td class="fw-medium" th:text="${item.brand}">Brand</td></tr>
          <tr th:if="${item.model != null}"><th style="color:#64748b;">Model</th><td class="fw-medium" th:text="${item.model}">Model</td></tr>
          <tr th:if="${item.color != null}"><th style="color:#64748b;">Color</th><td class="fw-medium" th:text="${item.color}">Color</td></tr>
          <tr><th style="color:#64748b;">Description</th><td th:text="${item.description}">Description</td></tr>
          <tr th:if="${item.uniqueFeatures != null}"><th style="color:#64748b;">Unique Features</th><td th:text="${item.uniqueFeatures}">Features</td></tr>
          <tr><th style="color:#64748b;">Lost Location</th><td class="fw-medium"><i class="bi bi-geo-alt me-1 text-danger"></i><span th:text="${item.lostLocation + ', ' + item.city}">City</span></td></tr>
          <tr><th style="color:#64748b;">Lost Date</th><td class="text-muted"><i class="bi bi-calendar me-1"></i><span th:text="${item.lostDate}">Date</span></td></tr>
        </table>

        <div class="d-flex gap-3">
          <a href="/lost/browse" class="btn btn-outline-secondary btn-lg flex-grow-1"><i class="bi bi-arrow-left me-2"></i>Back to Browse</a>
          <a th:href="@{/lost/recovered/{id}(id=${item.id})}" class="btn btn-success btn-lg flex-grow-1" th:if="${session.user != null and session.user.id == item.userId and item.status != 'RECOVERED'}">
            <i class="bi bi-check-circle me-2"></i>Mark as Recovered
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>
