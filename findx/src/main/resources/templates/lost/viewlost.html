<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="page-header">
  <div class="container px-4">
    <h1><i class="bi bi-search me-2" style="color:#6366f1;"></i>Browse Lost Items</h1>
  </div>
</div>
<div class="container px-4 py-4">
  <!-- Search Bar -->
  <div class="card mb-4" style="border-radius:16px;">
    <div class="card-body p-3">
      <form method="get" action="/lost/browse" class="row g-2 align-items-end">
        <div class="col-md-5">
          <label class="form-label small fw-semibold">Search Keyword</label>
          <input type="text" name="keyword" class="form-control" placeholder="Phone, wallet, bag..." th:value="${keyword}" id="lost-search-kw">
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-semibold">Category</label>
          <select name="category" class="form-select" id="lost-search-cat">
            <option value="">All Categories</option>
            <option th:each="cat : ${categories}" th:value="${cat.name}" th:text="${cat.name}"
                    th:selected="${cat.name == selectedCategory}">Category</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small fw-semibold">City</label>
          <input type="text" name="city" class="form-control" placeholder="City" th:value="${searchCity}" id="lost-search-city">
        </div>
        <div class="col-md-2 d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-grow-1" id="lost-search-btn"><i class="bi bi-search"></i> Search</button>
          <a href="/lost/browse" class="btn btn-outline-secondary"><i class="bi bi-x"></i></a>
        </div>
      </form>
    </div>
  </div>

  <!-- Results -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <p class="text-muted mb-0 small"><span th:text="${items.size()}">0</span> items found</p>
    <a href="/lost/report" class="btn btn-report-lost btn-sm"><i class="bi bi-plus me-1"></i>Report Lost</a>
  </div>

  <div class="row g-3" th:if="${!items.empty}">
    <div class="col-md-3 col-sm-6" th:each="item : ${items}">
      <div class="item-card h-100">
        <div th:if="${item.firstImage != null}">
          <img th:src="@{/uploads/{img}(img=${item.firstImage})}" class="item-image" th:alt="${item.itemName}">
        </div>
        <div th:if="${item.firstImage == null}" class="item-image-placeholder">
          <i class="bi bi-image"></i>
        </div>
        <div class="p-3">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h6 class="fw-bold mb-0 text-truncate pe-2" th:text="${item.itemName}">Item Name</h6>
            <span th:class="${'item-badge-' + item.status.toLowerCase()}" th:text="${item.status}">ACTIVE</span>
          </div>
          <p class="text-muted mb-1" style="font-size:0.8rem;"><i class="bi bi-tag me-1"></i><span th:text="${item.category}">Category</span></p>
          <p class="text-muted mb-1" style="font-size:0.8rem;" th:if="${item.brand != null and !item.brand.empty}">
            <i class="bi bi-building me-1"></i><span th:text="${item.brand}">Brand</span>
          </p>
          <p class="text-muted mb-1" style="font-size:0.8rem;"><i class="bi bi-geo-alt me-1"></i><span th:text="${item.city}">City</span></p>
          <p class="text-muted mb-2" style="font-size:0.8rem;"><i class="bi bi-calendar me-1"></i><span th:text="${item.lostDate}">Date</span></p>
          <a th:href="@{/lost/detail/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary w-100">
            <i class="bi bi-eye me-1"></i>View Details
          </a>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${items.empty}" class="text-center py-5 text-muted">
    <i class="bi bi-inbox display-4 d-block mb-3"></i>
    <h5>No items found</h5>
    <p class="small">Try different search terms or report a new lost item.</p>
    <a href="/lost/report" class="btn btn-primary">Report Lost Item</a>
  </div>
</div>
</main></body>
</html>
