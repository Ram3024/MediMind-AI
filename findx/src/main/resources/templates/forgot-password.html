<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="auth-page">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2" style="width:52px;height:52px;font-size:1.4rem;">
        <i class="bi bi-key-fill"></i>
      </div>
      <h4 class="fw-800 mb-0">Forgot Password?</h4>
      <p class="text-muted small">Enter your registered email to get a reset link</p>
    </div>

    <div th:if="${error}" class="alert alert-danger d-flex align-items-center py-2 mb-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <small th:text="${error}">Error</small>
    </div>
    <div th:if="${msg}" class="alert alert-success d-flex align-items-center py-2 mb-3">
      <i class="bi bi-check-circle-fill me-2"></i>
      <small th:text="${msg}">Message</small>
    </div>

    <form action="/forgot-password" method="post">
      <div class="mb-3">
        <label class="form-label">Registered Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
          <input type="email" name="email" class="form-control" placeholder="your@email.com" required id="forgot-email">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="forgot-submit-btn">
        <i class="bi bi-send me-2"></i>Generate Reset Link
      </button>
    </form>

    <!-- Info box -->
    <div class="mt-3 p-3 rounded-3" style="background:#f0fdf4;border:1px solid #86efac;">
      <p class="small fw-semibold mb-1" style="color:#059669;"><i class="bi bi-envelope-check me-1"></i>Email se Reset Link Aayega</p>
      <p class="small text-muted mb-0">Registered email pe password reset link bheja jayega. Spam folder bhi check karein.</p>
    </div>

    <div class="text-center mt-3">
      <a href="/login" class="small" style="color:#6366f1;"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
    </div>
  </div>
</div>
</main></body>
</html>
