<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="auth-page" style="align-items:flex-start;padding-top:40px;padding-bottom:40px;">
  <div class="auth-card" style="max-width:520px;">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2" style="width:52px;height:52px;font-size:1.4rem;">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h4 class="fw-800 mb-0">Create Account</h4>
      <p class="text-muted small">Join FindX and start recovering lost items</p>
    </div>

    <div th:if="${error}" class="alert alert-danger d-flex align-items-center py-2 mb-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <small th:text="${error}">Error</small>
    </div>

    <form action="/register" method="post" th:object="${udto}">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Full Name <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" th:field="*{name}" class="form-control" placeholder="Rahul Sharma" required id="reg-name">
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">Email Address <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
            <input type="email" th:field="*{email}" class="form-control" placeholder="your@email.com" required id="reg-email">
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
            <input type="tel" th:field="*{phone}" class="form-control" placeholder="+91 99999 88888" id="reg-phone">
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Gender</label>
          <select th:field="*{gender}" class="form-select" id="reg-gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">City</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-geo-alt-fill"></i></span>
            <input type="text" th:field="*{city}" class="form-control" placeholder="Mumbai" id="reg-city">
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" th:field="*{password}" id="reg-pwd" class="form-control" placeholder="Min 8 chars" required>
            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('reg-pwd',this)" style="border-radius:0 10px 10px 0;"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" th:field="*{confirmPassword}" id="reg-cpwd" class="form-control" placeholder="Re-enter password" required>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary w-100 py-2" id="reg-btn">
            <i class="bi bi-person-check-fill me-2"></i>Create Account
          </button>
        </div>

        <!-- Divider -->
        <div class="col-12 d-flex align-items-center my-1">
          <div class="flex-grow-1 border-top" style="border-color:#e2e8f0 !important;"></div>
          <span class="px-3 text-muted small fw-semibold" style="font-size:0.78rem;letter-spacing:0.5px;text-transform:uppercase;">or sign up with</span>
          <div class="flex-grow-1 border-top" style="border-color:#e2e8f0 !important;"></div>
        </div>

        <!-- Google Sign In Button (Real OAuth flow) -->
        <div class="col-12">
          <a href="/oauth2/authorization/google" class="btn btn-outline-light w-100 py-2 d-flex align-items-center justify-content-center gap-2 text-decoration-none shadow-sm" style="background:#ffffff;border:1px solid #dadce0;border-radius:10px;color:#3c4043;font-weight:600;font-size:0.92rem;transition:all 0.2s;" onmouseover="this.style.background='#f8f9fa';this.style.borderColor='#c6c9ce';" onmouseout="this.style.background='#ffffff';this.style.borderColor='#dadce0';" id="google-reg-btn">
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>Sign up with Google</span>
          </a>
        </div>

        <div class="col-12 text-center">
          <p class="text-muted small mb-0">Already have an account?
            <a href="/login" class="fw-semibold" style="color:#6366f1;">Sign In</a>
          </p>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- ═══════════════ GOOGLE SIGN-IN MODAL ═══════════════ -->
<div class="modal fade" id="googleModal" tabindex="-1" aria-labelledby="googleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 430px;">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 24px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      
      <!-- Modal Header -->
      <div class="modal-header border-0 pb-0 pt-4 px-4 flex-column align-items-center position-relative text-center">
        <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
        <!-- Google G logo -->
        <svg width="38" height="38" viewBox="0 0 48 48" class="mb-2">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <h5 class="modal-title fw-semibold text-dark mb-1" id="googleModalLabel" style="font-size: 1.25rem;">Sign Up with Google</h5>
        <p class="text-muted small mb-0">Continue directly to <span class="fw-semibold text-dark">FindX</span></p>
      </div>

      <!-- Modal Body -->
      <div class="modal-body px-4 py-3">
        <div class="p-3 rounded-3 border bg-light mb-3">
          <form action="/login/google/quick" method="post">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-dark mb-1">Your Gmail Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required autocomplete="email" autocapitalize="none">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold text-dark mb-1">Your Full Name (Optional)</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                <input type="text" name="name" class="form-control" placeholder="e.g. Your Name">
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2 fw-semibold shadow-sm" style="border-radius:10px;background:#1a73e8;border-color:#1a73e8;">
              <i class="bi bi-google"></i>
              <span>Continue with Google</span>
            </button>
          </form>
        </div>

        <p class="text-muted text-center mt-2 mb-0" style="font-size: 0.74rem; line-height: 1.4;">
          Google Sign-In creates a secure, verified FindX account instantly.
        </p>
      </div>
    </div>
  </div>
</div>

<script>
function togglePwd(id, btn) {
  var inp = document.getElementById(id);
  var icon = btn.querySelector('i');
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'bi bi-eye'; }
}

function toggleAnotherAccount() {
  var box = document.getElementById('another-account-box');
  var icon = document.getElementById('another-acc-icon');
  if (box.classList.contains('d-none')) {
    box.classList.remove('d-none');
    icon.className = 'bi bi-chevron-up text-muted small';
    document.getElementById('another-email-inp').focus();
  } else {
    box.classList.add('d-none');
    icon.className = 'bi bi-chevron-down text-muted small';
  }
}
</script>
</main></body>
</html>
