<!doctype html>
<html lang="en" th:fragment="layout(content)">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FindX Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="/css/custom.css" rel="stylesheet">
<style>
  .admin-sidebar { width:240px; min-height:100vh; background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%); position:fixed; top:0; left:0; z-index:1000; transition:all 0.3s; }
  .admin-main { margin-left:240px; min-height:100vh; background:#f1f5f9; }
  .admin-brand { padding:20px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .sidebar-nav .nav-link { color:rgba(255,255,255,0.7); padding:10px 20px; border-radius:0; display:flex; align-items:center; gap:10px; font-size:0.875rem; transition:all 0.2s; }
  .sidebar-nav .nav-link:hover, .sidebar-nav .nav-link.active { color:#fff; background:rgba(99,102,241,0.3); border-left:3px solid #6366f1; }
  .sidebar-nav .nav-link i { font-size:1rem; width:20px; }
  .sidebar-section { padding:12px 20px 4px; font-size:0.7rem; text-transform:uppercase; color:rgba(255,255,255,0.35); letter-spacing:1px; }
  .admin-topbar { background:#fff; padding:12px 24px; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; justify-content:space-between; }
  .admin-content { padding:24px; }
  @media(max-width:768px){ .admin-sidebar{display:none} .admin-main{margin-left:0} }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="admin-sidebar">
  <div class="admin-brand">
    <div class="d-flex align-items-center gap-2">
      <div class="brand-icon brand-icon-sm"><i class="bi bi-search-heart-fill"></i></div>
      <div>
        <div class="brand-name text-white fs-5">Find<span class="brand-x">X</span></div>
        <small style="color:rgba(255,255,255,0.4);font-size:0.65rem;">ADMIN PANEL</small>
      </div>
    </div>
  </div>

  <div class="sidebar-section">Main</div>
  <ul class="sidebar-nav list-unstyled mb-0">
    <li><a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
  </ul>

  <div class="sidebar-section">Management</div>
  <ul class="sidebar-nav list-unstyled mb-0">
    <li><a class="nav-link" href="/admin/users"><i class="bi bi-people-fill"></i>Users</a></li>
    <li><a class="nav-link" href="/admin/lost"><i class="bi bi-exclamation-circle-fill"></i>Lost Reports</a></li>
    <li><a class="nav-link" href="/admin/found"><i class="bi bi-bag-check-fill"></i>Found Reports</a></li>
    <li><a class="nav-link" href="/admin/claims"><i class="bi bi-file-check-fill"></i>Claims</a></li>
    <li><a class="nav-link" href="/admin/matches"><i class="bi bi-robot"></i>AI Matches</a></li>
    <li><a class="nav-link" href="/admin/contact-messages"><i class="bi bi-envelope-fill"></i>Contact Messages</a></li>
  </ul>

  <div class="sidebar-section">Settings</div>
  <ul class="sidebar-nav list-unstyled mb-0">
    <li><a class="nav-link" href="/admin/categories"><i class="bi bi-tags-fill"></i>Categories</a></li>
    <li><a class="nav-link" href="/admin/settings"><i class="bi bi-gear-fill"></i>Settings</a></li>
    <li><a class="nav-link" href="/"><i class="bi bi-globe"></i>View Site</a></li>
    <li><a class="nav-link text-danger" href="/admin/logout"><i class="bi bi-box-arrow-right"></i>Logout</a></li>
  </ul>
</div>

<!-- Main Area -->
<div class="admin-main">
  <!-- Top Bar -->
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <h6 class="mb-0 fw-semibold text-muted">Admin Panel</h6>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div th:if="${admin}" class="d-flex align-items-center gap-2">
        <div class="user-avatar" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">A</div>
        <span class="fw-medium small" th:text="${admin.name}">Admin</span>
      </div>
    </div>
  </div>

  <!-- Flash Messages -->
  <div class="admin-content pb-0">
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="bi bi-check-circle-fill me-2"></i><span th:text="${msg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  </div>

  <!-- Content -->
  <div class="admin-content">
    <div th:replace="${content}"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
