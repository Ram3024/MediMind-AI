<html lang="en" th:replace="~{adminbase::layout(~{::main})}">
<body><main>
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0"><i class="bi bi-robot me-2" style="color:#6366f1;"></i>All AI Matches</h4>
  <span class="badge rounded-pill px-3 py-2" style="background:#ede9fe;color:#6366f1;" th:text="${matches.size() + ' matches'}">0</span>
</div>
<div th:if="${msg}" class="alert alert-success py-2 mb-3"><i class="bi bi-check-circle me-2"></i><span th:text="${msg}"></span></div>
<div class="card" style="border-radius:14px;">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>#</th><th>Lost Item</th><th>Found Item</th><th>Text%</th><th>Location%</th><th>Brand%</th><th>Color%</th><th>Date%</th><th>Overall</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody>
          <tr th:each="m, s : ${matches}">
            <td th:text="${s.count}">1</td>
            <td>
              <div class="fw-medium small" th:text="${lostMap[m.lostItemId] != null ? lostMap[m.lostItemId].itemName : 'ID:'+m.lostItemId}">Item</div>
              <small class="text-muted" th:text="${lostMap[m.lostItemId] != null ? lostMap[m.lostItemId].city : ''}">City</small>
            </td>
            <td>
              <div class="fw-medium small" th:text="${foundMap[m.foundItemId] != null ? foundMap[m.foundItemId].itemName : 'ID:'+m.foundItemId}">Item</div>
              <small class="text-muted" th:text="${foundMap[m.foundItemId] != null ? foundMap[m.foundItemId].city : ''}">City</small>
            </td>
            <td><span class="badge" style="background:#ede9fe;color:#6366f1;" th:text="${m.textScoreInt+'%'}"></span></td>
            <td><span class="badge" style="background:#dcfce7;color:#059669;" th:text="${m.locationScoreInt+'%'}"></span></td>
            <td><span class="badge" style="background:#fef3c7;color:#d97706;" th:text="${m.brandScoreInt+'%'}"></span></td>
            <td><span class="badge" style="background:#fce7f3;color:#db2777;" th:text="${m.colorScoreInt+'%'}"></span></td>
            <td><span class="badge" style="background:#ccfbf1;color:#0d9488;" th:text="${m.dateScoreInt+'%'}"></span></td>
            <td>
              <span th:class="${m.overallScore >= 80 ? 'match-score-badge score-excellent' :
                               (m.overallScore >= 65 ? 'match-score-badge score-good' :
                               (m.overallScore >= 50 ? 'match-score-badge score-moderate' : 'match-score-badge score-low'))}"
                    th:text="${m.overallScoreInt+'%'}"></span>
            </td>
            <td><span class="badge badge-pending" th:text="${m.status}">PENDING</span></td>
            <td>
              <a th:href="@{/admin/matches/delete/{id}(id=${m.id})}"
                 class="btn btn-danger btn-sm"
                 style="border-radius:8px;padding:3px 10px;font-size:0.72rem;"
                 onclick="return confirm('Delete this match?')">Delete</a>
            </td>
          </tr>
          <tr th:if="${matches.empty}"><td colspan="11" class="text-center text-muted py-4">No AI matches generated yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</main></body>
</html>
