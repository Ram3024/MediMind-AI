<html lang="en" th:replace="~{adminbase::layout(~{::main})}">
<body><main>
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
  <div>
    <h4 class="fw-bold mb-1"><i class="bi bi-people-fill me-2" style="color:#6366f1;"></i>Manage Users</h4>
    <p class="text-muted small mb-0">View registered users, real-time online status, and account controls</p>
  </div>
  <div class="d-flex align-items-center gap-2">
    <span class="badge rounded-pill px-3 py-2" style="background:#dcfce7;color:#047857;font-weight:600;">
      <i class="bi bi-circle-fill me-1" style="font-size:0.45rem;color:#10b981;"></i><span th:text="${onlineUsers}">0</span> Online Now
    </span>
    <span class="badge rounded-pill px-3 py-2" style="background:#ede9fe;color:#6366f1;" th:text="${users.size() + ' Total Users'}">0 Users</span>
  </div>
</div>
<div th:if="${msg}" class="alert alert-success py-2 mb-3"><i class="bi bi-check-circle me-2"></i><span th:text="${msg}"></span></div>
<div class="card" style="border-radius:14px;">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>User</th>
            <th>Contact</th>
            <th>Role</th>
            <th>Real Activity</th>
            <th>Account</th>
            <th>Registered</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user, s : ${users}">
            <td th:text="${s.count}">1</td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <img th:if="${user.profilePic != null and !user.profilePic.empty}" th:src="${user.profilePic}" alt="Avatar" class="rounded-circle shadow-sm" style="width:34px;height:34px;object-fit:cover;">
                <div th:unless="${user.profilePic != null and !user.profilePic.empty}" class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold shadow-sm" style="width:34px;height:34px;background:linear-gradient(135deg,#6366f1,#8b5cf6);font-size:0.85rem;" th:text="${user.name != null and !user.name.empty ? user.name.substring(0,1).toUpperCase() : 'U'}">U</div>
                <div>
                  <div class="fw-semibold text-dark" th:text="${user.name}">User Name</div>
                  <small class="text-muted" th:text="${user.email}">user@email.com</small>
                </div>
              </div>
            </td>
            <td>
              <div><small class="fw-medium text-dark" th:text="${user.phone != null and !user.phone.empty ? user.phone : 'No Phone'}">Phone</small></div>
              <small class="text-muted" th:text="${user.city != null and !user.city.empty ? user.city : 'N/A'}">City</small>
            </td>
            <td><span class="badge" style="background:#dbeafe;color:#2563eb;" th:text="${user.role}">USER</span></td>
            <td>
              <span th:if="${user.isOnline()}" class="badge rounded-pill px-2.5 py-1.5" style="background:#dcfce7;color:#047857;font-weight:600;font-size:0.75rem;">
                <i class="bi bi-circle-fill me-1" style="font-size:0.45rem;color:#10b981;"></i>Online Now
              </span>
              <span th:unless="${user.isOnline()}" class="badge rounded-pill px-2.5 py-1.5 bg-light text-secondary border" style="font-size:0.75rem;">
                <i class="bi bi-clock-history me-1 text-muted"></i><span th:text="${user.lastActiveFormatted}">Never</span>
              </span>
            </td>
            <td>
              <span th:class="${user.status == 'ACTIVE' ? 'badge badge-active' : 'badge badge-blocked'}"
                    th:text="${user.status}">ACTIVE</span>
            </td>
            <td><small class="text-muted" th:text="${user.regDateFormatted}">Date</small></td>
            <td>
              <div class="d-flex gap-1">
                <a th:href="@{/admin/users/block/{id}(id=${user.id})}"
                   th:class="${user.status == 'ACTIVE' ? 'btn btn-warning btn-sm' : 'btn btn-success btn-sm'}"
                   style="border-radius:8px;padding:3px 10px;font-size:0.72rem;"
                   th:text="${user.status == 'ACTIVE' ? 'Block' : 'Unblock'}">Block</a>
                <a th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                   class="btn btn-danger btn-sm"
                   style="border-radius:8px;padding:3px 10px;font-size:0.72rem;"
                   onclick="return confirm('Delete this user permanently?')">Delete</a>
              </div>
            </td>
          </tr>
          <tr th:if="${users.empty}"><td colspan="8" class="text-center text-muted py-4">No users found</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</main></body>
</html>
