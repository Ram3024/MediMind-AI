<html lang="en" th:replace="~{adminbase::layout(~{::main})}">
<body><main>
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0"><i class="bi bi-gear-fill me-2" style="color:#6366f1;"></i>Admin Settings</h4>
</div>

<div th:if="${msg}" class="alert alert-success py-2 mb-3"><i class="bi bi-check-circle me-2"></i><span th:text="${msg}"></span></div>
<div th:if="${pwdError}" class="alert alert-danger py-2 mb-3"><i class="bi bi-exclamation-circle me-2"></i><span th:text="${pwdError}"></span></div>

<div class="row g-4">
  <!-- Admin Profile Info -->
  <div class="col-lg-4">
    <div class="card" style="border-radius:16px;">
      <div class="card-body text-center p-4">
        <div class="mx-auto mb-3" style="width:72px;height:72px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:800;">A</div>
        <h5 class="fw-bold mb-1" th:text="${admin.name}">Admin</h5>
        <p class="text-muted small mb-1" th:text="${admin.email}">admin@findx.in</p>
        <span class="badge" style="background:#ede9fe;color:#6366f1;" th:text="'ID: ' + ${admin.adminid}">admin</span>
      </div>
    </div>
  </div>

  <!-- Change Password -->
  <div class="col-lg-8">
    <div class="card" style="border-radius:16px;">
      <div class="card-body p-4">
        <h6 class="fw-bold mb-3" style="color:#dc2626;border-bottom:2px solid #fee2e2;padding-bottom:8px;">
          <i class="bi bi-shield-lock-fill me-2"></i>Change Admin Password
        </h6>
        <form action="/admin/change-password" method="post">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label">Current Password</label>
              <input type="password" name="currentPassword" class="form-control" required id="admin-current-pwd" placeholder="Enter current password">
            </div>
            <div class="col-md-6">
              <label class="form-label">New Password</label>
              <input type="password" name="newPassword" class="form-control" required id="admin-new-pwd" placeholder="Min 6 characters">
            </div>
            <div class="col-md-6">
              <label class="form-label">Confirm New Password</label>
              <input type="password" name="confirmPassword" class="form-control" required id="admin-confirm-pwd" placeholder="Repeat new password">
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-danger" id="admin-change-pwd-btn">
                <i class="bi bi-lock-fill me-2"></i>Update Admin Password
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>
