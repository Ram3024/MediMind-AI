<html lang="en" th:replace="~{adminbase::layout(~{::main})}">
<body><main>
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0"><i class="bi bi-tags-fill me-2" style="color:#6366f1;"></i>Manage Categories</h4>
</div>
<div class="row g-4">
  <!-- Add Category -->
  <div class="col-md-4">
    <div class="card" style="border-radius:14px;">
      <div class="card-header bg-white py-3 px-4">
        <h6 class="mb-0 fw-bold">Add New Category</h6>
      </div>
      <div class="card-body">
        <form action="/admin/categories/add" method="post">
          <div class="mb-3">
            <label class="form-label">Category Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Electronics" required id="cat-name">
          </div>
          <div class="mb-3">
            <label class="form-label">Bootstrap Icon Class</label>
            <input type="text" name="iconClass" class="form-control" placeholder="e.g. bi-phone-fill" id="cat-icon">
            <div class="form-text">Find icons at <a href="https://icons.getbootstrap.com" target="_blank">icons.getbootstrap.com</a></div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="cat-add-btn">
            <i class="bi bi-plus-circle me-2"></i>Add Category
          </button>
        </form>
      </div>
    </div>
  </div>
  <!-- Category List -->
  <div class="col-md-8">
    <div class="card" style="border-radius:14px;">
      <div class="card-header bg-white py-3 px-4">
        <h6 class="mb-0 fw-bold">All Categories (<span th:text="${categories.size()}">0</span>)</h6>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>#</th><th>Icon</th><th>Category Name</th><th>Action</th></tr></thead>
            <tbody>
              <tr th:each="cat, s : ${categories}">
                <td th:text="${s.count}">1</td>
                <td><i th:class="'bi ' + ${cat.iconClass}" style="font-size:1.2rem;color:#6366f1;"></i></td>
                <td class="fw-medium" th:text="${cat.name}">Category</td>
                <td>
                  <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}"
                     class="btn btn-danger btn-sm" style="border-radius:8px;padding:3px 10px;font-size:0.72rem;"
                     onclick="return confirm('Delete this category?')">
                    <i class="bi bi-trash"></i> Delete
                  </a>
                </td>
              </tr>
              <tr th:if="${categories.empty}"><td colspan="4" class="text-center text-muted py-4">No categories found. Add one above.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>
