<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="page-header">
  <div class="container px-4">
    <h1><i class="bi bi-person-fill me-2" style="color:#6366f1;"></i>My Profile</h1>
  </div>
</div>
<div class="container px-4 py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="form-card">
        <!-- Profile Header -->
        <div class="d-flex align-items-center gap-4 mb-4 p-3 rounded-3" style="background:#f8faff;">
          <!-- Profile Photo -->
          <div style="position:relative;width:80px;height:80px;flex-shrink:0;">
            <img th:if="${user.profilePic != null and !user.profilePic.isEmpty()}"
                 th:src="@{/uploads/{img}(img=${user.profilePic})}"
                 style="width:80px;height:80px;border-radius:20px;object-fit:cover;border:3px solid #ede9fe;"
                 alt="Profile Photo" id="profile-pic-preview">
            <div th:if="${user.profilePic == null or user.profilePic.isEmpty()}"
                 id="profile-pic-preview"
                 style="width:80px;height:80px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:800;"
                 th:text="${user.name.substring(0,1).toUpperCase()}">U</div>
            <!-- Upload overlay -->
            <label for="pic-upload-input" title="Change photo"
                   style="position:absolute;bottom:-6px;right:-6px;width:26px;height:26px;background:#6366f1;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;">
              <i class="bi bi-camera-fill text-white" style="font-size:0.7rem;"></i>
            </label>
          </div>
          <div>
            <h4 class="fw-bold mb-1" th:text="${user.name}">User Name</h4>
            <p class="text-muted mb-1 small" th:text="${user.email}">email@example.com</p>
            <span class="badge" style="background:#ede9fe;color:#6366f1;" th:text="${user.role}">USER</span>
            <span class="badge ms-1" style="background:#dcfce7;color:#059669;" th:text="${user.status}">ACTIVE</span>
          </div>
        </div>
        <!-- Hidden file upload form -->
        <form action="/user/profile/upload-pic" method="post" enctype="multipart/form-data" id="pic-upload-form">
          <input type="file" name="profilePic" id="pic-upload-input" accept="image/*" style="display:none;"
                 onchange="document.getElementById('pic-upload-form').submit();">
        </form>

        <!-- Stats Row -->
        <div class="row g-2 mb-4">
          <div class="col-4 text-center p-3 rounded-3" style="background:#fff5f5;">
            <div class="fw-bold" style="color:#dc2626;font-size:1.5rem;" th:text="${user.lostCount}">0</div>
            <div class="small text-muted">Lost Items</div>
          </div>
          <div class="col-4 text-center p-3 rounded-3" style="background:#f0fdf4;">
            <div class="fw-bold" style="color:#059669;font-size:1.5rem;" th:text="${user.foundCount}">0</div>
            <div class="small text-muted">Found Items</div>
          </div>
          <div class="col-4 text-center p-3 rounded-3" style="background:#fef3c7;">
            <div class="fw-bold" style="color:#d97706;font-size:1.5rem;" th:text="${user.recoveredCount}">0</div>
            <div class="small text-muted">Recovered</div>
          </div>
        </div>

        <!-- Edit Form -->
        <h6 class="fw-bold mb-3" style="color:#6366f1;border-bottom:2px solid #ede9fe;padding-bottom:8px;">
          <i class="bi bi-pencil-fill me-2"></i>Edit Profile
        </h6>
        <div th:if="${msg}" class="alert alert-success py-2"><i class="bi bi-check-circle me-2"></i><span th:text="${msg}"></span></div>
        <div th:if="${pwdError}" class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-2"></i><span th:text="${pwdError}"></span></div>
        <form action="/user/profile/update" method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" name="name" class="form-control" th:value="${user.name}" required id="profile-name">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email (Read Only)</label>
              <input type="email" class="form-control" th:value="${user.email}" readonly style="background:#f8fafc;">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone Number</label>
              <input type="text" name="phone" class="form-control" th:value="${user.phone}" id="profile-phone">
            </div>
            <div class="col-md-6">
              <label class="form-label">City</label>
              <input type="text" name="city" class="form-control" th:value="${user.city}" id="profile-city">
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <textarea name="address" class="form-control" rows="2" id="profile-address" th:text="${user.address}"></textarea>
            </div>
            <div class="col-12 d-flex gap-3">
              <button type="submit" class="btn btn-primary" id="profile-save-btn">
                <i class="bi bi-check-circle me-2"></i>Save Changes
              </button>
              <a href="/user/dashboard" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>

        <!-- Change Password -->
        <hr class="my-4">
        <h6 class="fw-bold mb-3" style="color:#dc2626;border-bottom:2px solid #fee2e2;padding-bottom:8px;">
          <i class="bi bi-shield-lock-fill me-2"></i>Change Password
        </h6>
        <form action="/user/change-password" method="post">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Current Password</label>
              <input type="password" name="currentPassword" class="form-control" required id="current-pwd" placeholder="Enter current password">
            </div>
            <div class="col-md-4">
              <label class="form-label">New Password</label>
              <input type="password" name="newPassword" class="form-control" required id="new-pwd" placeholder="Min 6 characters">
            </div>
            <div class="col-md-4">
              <label class="form-label">Confirm New Password</label>
              <input type="password" name="confirmPassword" class="form-control" required id="confirm-pwd" placeholder="Repeat new password">
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-danger" id="change-pwd-btn">
                <i class="bi bi-lock-fill me-2"></i>Update Password
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</main></body>
</html>
