<html lang="en" th:replace="~{base::layout(~{::main})}">
<body><main>
<div class="auth-page">
  <div class="auth-card" style="max-width:400px;">
    <div class="text-center mb-4">
      <div style="width:52px;height:52px;background:linear-gradient(135deg,#1e293b,#334155);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;margin:0 auto 12px;">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h4 class="fw-bold mb-1">Admin Login</h4>
      <p class="text-muted small">FindX Administration Panel</p>
    </div>
    <div th:if="${error}" class="alert alert-danger d-flex align-items-center py-2 mb-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <small th:text="${error}">Error</small>
    </div>
    <form action="/adminlogin" method="post">
      <div class="mb-3">
        <label class="form-label">Admin ID</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
          <input type="text" name="adminid" class="form-control" placeholder="admin" required id="adminid">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required id="admin-pwd">
        </div>
      </div>
      <button type="submit" class="btn btn-dark w-100 py-2 mb-3" id="admin-login-btn" style="border-radius:10px;font-weight:600;">
        <i class="bi bi-shield-check me-2"></i>Admin Sign In
      </button>
    </form>
    <div class="text-center">
      <a href="/login" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to User Login</a>
    </div>
    <div class="mt-3 p-3 rounded-3" style="background:#f1f5f9;border:1px dashed #94a3b8;">
      <p class="small text-muted mb-0"><i class="bi bi-info-circle me-1"></i>Default: ID = <strong>admin</strong> | Password = <strong>admin123</strong></p>
    </div>
  </div>
</div>
</main></body>
</html>
